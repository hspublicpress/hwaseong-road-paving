<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도로·보도 포장 발주 주기 지도</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span id="city-title">화성시</span> 도로·보도 포장 발주 주기</h1>
  <select id="city-select" title="시군 선택"></select>
  <select id="dong-select" title="읍면동 선택"><option value="">읍면동 전체</option></select>
  <label><input type="checkbox" id="chk-road" checked> 차도</label>
  <label><input type="checkbox" id="chk-walk" checked> 보도</label>
  <label><input type="checkbox" id="chk-c"> 근사 위치(도로 전체·읍면동) 표시</label>
  <input id="search" type="search" placeholder="공고명·도로명 검색">
  <a id="guide-link" href="guide.html" target="_blank" rel="noopener">다른 지역에서 만들기 →</a>
</header>
<div id="wrap">
  <div id="map"><a id="open-full" href="./" target="_blank" rel="noopener" hidden>⤢ 새 창에서 크게 보기</a></div>
  <aside id="panel">
    <div id="legend"></div>
    <div id="stats"></div>
    <div id="list"></div>
    <div id="detail" hidden></div>
    <p id="note"></p>
  </aside>
</div>
<div id="overlay-msg" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
